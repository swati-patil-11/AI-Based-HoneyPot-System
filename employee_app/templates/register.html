<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Employee Management System - Register</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Create Employee Account</h1>

            <p class="subtitle">
                Register for the employee portal
            </p>


            <form id="registerForm">

                <div class="form-group">

                    <label for="registerUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                >
                    Register
                </button>

            </form>


            <div
                id="registerMessage"
                class="message"
            ></div>


            <p class="auth-link">

                Already have an account?

                <a href="/">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="/static/js/app.js"></script>

</body>

</html>
