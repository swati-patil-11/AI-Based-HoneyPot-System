<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System - Login</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Employee Management System</h1>

            <p class="subtitle">
                Secure Employee Portal
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                >
                    Login
                </button>

            </form>


            <div
                id="loginMessage"
                class="message"
            ></div>


            <p class="auth-link">

                Don't have an account?

                <a href="/register">
                    Register
                </a>

            </p>

        </div>

    </div>


    <script src="/static/js/app.js"></script>

</body>

</html>
