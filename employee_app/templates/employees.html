<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>Employee System</h2>

        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/employees-page">Employees</a>
              <a href="/departments-page">  Departments</a>
            <a href="/attendance-page">  Attendance</a>
            <a href="/payroll-page">Payroll</a>
            <a href="/profile-page">My Profile</a>
        </nav>

        <button id="logoutButton" class="logout-button">
            Logout
        </button>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <header class="dashboard-header">

            <div>
                <h1>Employee Management</h1>

                <p id="employeePageWelcome">
                    Manage employees
                </p>
            </div>

            <button
                id="showAddEmployeeButton"
                class="btn-primary employee-add-button"
            >
                + Add Employee
            </button>

        </header>


        <!-- Access Message -->

        <div
            id="employeeAccessMessage"
            class="message"
        ></div>


        <!-- Add Employee Form -->

        <section
            id="addEmployeeSection"
            class="profile-card"
            style="display: none;"
        >

            <h2>Add New Employee</h2>

            <form id="employeeForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label for="employeeId">
                            Employee ID
                        </label>

                        <input
                            type="text"
                            id="employeeId"
                            placeholder="EMPXXXX"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="firstName">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            placeholder="First name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="lastName">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            placeholder="Last name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="employee@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone
                        </label>

                        <input
                            type="text"
                            id="phone"
                            placeholder="+1234567890"
                        >

                    </div>


                    <div class="form-group">

                        <label for="departmentId">
                            Department ID
                        </label>

                        <input
                            type="number"
                            id="departmentId"
                            placeholder="1"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="designation">
                            Designation
                        </label>

                        <input
                            type="text"
                            id="designation"
                            placeholder="Software Developer"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="joiningDate">
                            Joining Date
                        </label>

                        <input
                            type="date"
                            id="joiningDate"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="employmentStatus">
                            Employment Status
                        </label>

                        <select id="employmentStatus">

                            <option value="Active">
                                Active
                            </option>

                            <option value="Inactive">
                                Inactive
                            </option>

                            <option value="On Leave">
                                On Leave
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Create Employee
                    </button>

                    <button
                        type="button"
                        id="cancelEmployeeButton"
                        class="btn-secondary"
                    >
                        Cancel
                    </button>

                </div>

            </form>


            <div
                id="employeeFormMessage"
                class="message"
            ></div>

        </section>


        <!-- Employee List -->

        <section class="profile-card">

            <div class="section-header">

                <div>
                    <h2>Employees</h2>

                    <p>
                        Employee records in the system
                    </p>
                </div>

                <button
                    id="refreshEmployeesButton"
                    class="btn-secondary"
                >
                    Refresh
                </button>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Employee Code</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Designation</th>
                            <th>Status</th>
                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="employeeTableBody">

                        <tr>

                            <td
                                colspan="8"
                                class="empty-table"
                            >
                                Loading employees...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<script src="/static/js/app.js"></script>

</body>
</html>
